<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>Desafio IA em 28 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
<style>
/* ===== Versão B: clara e editorial ===== */
:root{
  --display:"Fraunces",Georgia,serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
  --h1w:600; --h2w:600; --radius:12px; --em-style:italic;
  --bg:#f7f5f0; --top-bg:rgba(247,245,240,.88);
  --card:#fff; --card-solid:#fff; --card-hi:#f0f6f4;
  --line:#e7e2d7; --line-strong:#cbc4b3;
  --ink:#14213d; --muted:#5d6676;
  --brand:#0f5c4d; --brand-ink:#fff; --logo-accent:#b08d57;
  --em:#0f5c4d;
  --bar:#0f5c4d; --meter-low:#c9a46a;
  --tile:#f0f6f4; --tile-ink:#0f5c4d;
  --cta-bg:#14213d; --cta-ink:#fff; --cta-shadow:0 12px 26px -14px rgba(20,33,61,.6);
  --buy-bg:#0f5c4d; --buy-ink:#fff; --buy-shadow:0 14px 30px -14px rgba(15,92,77,.65);
  --badge-bg:#fff; --badge-ink:#0f5c4d; --badge-line:#d3e4df;
  --ok:#0f5c4d; --opt-hover:#9fc4ba;
  --shadow:0 1px 2px rgba(20,33,61,.04),0 8px 24px -16px rgba(20,33,61,.18);
  --sel-shadow:0 0 0 3px rgba(15,92,77,.12);
  --glow:0 10px 30px -18px rgba(15,92,77,.5);
  --overlay:rgba(20,33,61,.45);
  --prize-bg:radial-gradient(circle at 50% 30%,#fff,#efe9dc);
  --scratch:#cbb894; --scratch-ink:#6f5e3c;
  --price-bg:#fff; --price-line:#b08d57;
}
body{background-image:radial-gradient(900px 500px at 50% -10%,#fff 0%,transparent 70%)}
.top{border-bottom:1px solid var(--line)}
.bar{margin-top:0;position:relative;top:1px;height:2px;background:transparent}
.logo{font-family:var(--display);font-weight:600;letter-spacing:-.01em;font-size:20px}
h1{letter-spacing:-.03em}
h1::after{content:"";display:block;width:56px;height:2px;background:#b08d57;margin:18px auto 0}
.badge,.tag{box-shadow:0 1px 2px rgba(20,33,61,.05)}
.opt .lbl-big,.weeks .n,.compare b{font-family:var(--display)}
.weeks .n{font-style:italic}
.price{border-width:1.5px}
.price .tag{color:#7a5f30;border-color:#e4d3b3;background:#fbf6ec}
.scratch{border-color:#e4d3b3}
.hero-ic{border-radius:50%}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <button class="back" id="back" aria-label="Voltar"></button>
    <div class="logo" id="logo"></div>
    <span class="count" id="count"></span>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="app"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mq">
  <div class="box"><h2 id="mq">Você está pronto para começar hoje?</h2>
    <div class="opts"><button class="opt" data-m="nao">Ainda não</button><button class="opt" data-m="sim">Sim!</button></div></div>
</div>
<footer>© <span id="yr"></span> <span id="brand2"></span> · Termos de uso · Política de privacidade</footer>
<script src="quiz.js"></script>
</body>
</html>
