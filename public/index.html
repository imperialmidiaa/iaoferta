<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desafio IA em 28 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Configure aqui: cores da sua marca ===== */
:root{
  --brand:#1f5fe0; --brand-ink:#fff; --brand-soft:#e8f0ff; --accent:#f28c28;
  --bg:#f7f7fb; --card:#fff; --ink:#15132b; --muted:#6a6884; --line:#e4e2f0;
  --display:"Sora","Trebuchet MS",sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 8px}
.topin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.back{border:0;background:none;font-size:22px;color:var(--ink);visibility:hidden}
.logo{text-align:center;font:800 18px var(--display);letter-spacing:-.02em}
.logo span{color:var(--brand)}
.bar{max-width:520px;margin:10px auto 0;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .35s}
main{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.step{display:none;animation:in .3s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:800 clamp(28px,7vw,38px)/1.1 var(--display);letter-spacing:-.02em;margin:18px 0 10px;text-align:center;text-wrap:balance}
h2{font:700 clamp(22px,5.5vw,28px)/1.2 var(--display);margin:14px 0 8px;text-align:center;text-wrap:balance}
h2 em,h1 em{font-style:normal;color:var(--brand)}
.sub{color:var(--muted);text-align:center;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font-weight:600;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--brand)}
.opt:active{transform:scale(.99)}
.opt .ic{font-size:24px;line-height:1}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opts.two .opt{flex-direction:column;justify-content:center;text-align:center;padding:20px 10px}
.opts.two .opt .ic{font-size:40px}
.opt .chk{margin-left:auto;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none}
.opt.sel .chk{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--brand-soft)}
.cta{display:block;width:100%;border:0;border-radius:14px;padding:16px;background:var(--brand);color:var(--brand-ink);font:700 17px var(--body);margin-top:18px;text-align:center;text-decoration:none}
.cta:disabled{opacity:.45;cursor:not-allowed}
.cta.green{background:var(--accent);color:#06281a}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.load{display:grid;gap:14px;margin:20px 0}
.lrow{font-weight:600;font-size:15px}
.lrow div{display:flex;justify-content:space-between}
.lbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.lbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s linear}
.modal{position:fixed;inset:0;background:rgba(21,19,43,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;max-width:380px;width:100%;text-align:center}
.box .opts{grid-template-columns:1fr 1fr;margin-top:14px}
.box .opt{justify-content:center}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:15px 16px;font:500 16px var(--body);background:var(--card);color:var(--ink)}
.field:focus{border-color:var(--brand);outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.compare .card{margin:0;text-align:center}
.compare b{display:block;font:700 15px var(--display);margin-bottom:8px}
.meter{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
.weeks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.weeks li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.weeks .n{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 15px var(--display)}
.weeks p{margin:2px 0 0;color:var(--muted);font-size:14px}
.inc{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.inc li::before{content:"✓";color:var(--accent);font-weight:800;margin-right:8px}
.price{text-align:center}
.price s{color:var(--muted)}
.price .big{font:800 44px/1 var(--display);margin:6px 0;color:var(--ink)}
.faq details{border-top:1px solid var(--line);padding:12px 0}
.faq summary{font-weight:700;cursor:pointer}
.faq p{color:var(--muted);margin:8px 0 0}
.dep{font-size:14px;color:var(--muted);border-left:3px solid var(--brand);padding-left:10px;margin:10px 0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:20px 16px}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <button class="back" id="back" aria-label="Voltar">←</button>
    <div class="logo" id="logo"></div>
    <span></span>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="app"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mq">
  <div class="box"><h2 id="mq" style="margin-top:0">Você está pronto para começar hoje?</h2>
    <div class="opts"><button class="opt" data-m="nao">Ainda não</button><button class="opt" data-m="sim">Sim!</button></div></div>
</div>
<footer>© <span id="yr"></span> <span id="brand2"></span> · Termos de uso · Política de privacidade</footer>

<script>
/* ============ CONFIGURE AQUI ============ */
const CONFIG = {
  marca: "Rota<span>IA</span>",          // nome da sua marca (pode usar <span> para colorir parte)
  marcaTexto: "RotaIA",                   // nome sem formatação, para o rodapé
  checkout: "https://SEU-CHECKOUT-AQUI",  // link do seu checkout (Kiwify, Hotmart, Cakto…)
  precoDe: "R$ 97,00",
  precoPor: "R$ 27,90",
  parcelas: "ou 3x de R$ 9,97",
  garantia: "7 dias",
  desconto: "70% OFF",                    // o que aparece na raspadinha (use um desconto real)
  // Assinatura com período de teste (deixe teste: null para pagamento único)
  teste: null,                            // exemplo: { preco: "R$ 9,90", periodo: "7 dias", renovacao: "R$ 29,90 a cada 4 semanas" }
  cronometroMin: 0,                       // minutos do cronômetro da oferta; 0 desliga. Use só com prazo real.
  // Depoimentos: use apenas depoimentos reais de alunos, com autorização.
  depoimentos: [
    // { nome: "Nome do aluno", cargo: "Profissão", texto: "O que ele disse de verdade." },
  ],
};
/* ======================================== */

const STEPS = [
  { id:"genero", q:"Responda rápido e receba <em>seu plano</em>", sub:"Para começar, como você se identifica?", two:true,
    o:[["👨","Homem"],["👩","Mulher"]] },
  { id:"idade", q:"Seu plano de IA começa <em>por onde você está hoje</em>", sub:"Qual é a sua faixa de idade?", two:true,
    o:[["🧑","18 a 24"],["👩","25 a 34"],["🧔","35 a 44"],["👵","45 ou mais"]] },
  { id:"meta", q:"O que você quer conquistar com IA <em>nos próximos 28 dias</em>?",
    o:[["💰","Ganhar mais sem trabalhar mais horas"],["📈","Ter melhores oportunidades de trabalho"],["🎯","Aprender uma habilidade que paga bem"],["🕊️","Ter mais tempo livre e menos estresse"],["🚀","Criar um negócio próprio"]] },
  { id:"area", q:"Qual dessas opções descreve <em>seu momento</em>?", sub:"Escolha a mais próxima",
    o:[["🏢","Trabalho CLT"],["💻","Autônomo ou freelancer"],["🏪","Tenho um negócio"],["🎓","Estudante"],["🔎","Procurando oportunidades"]] },
  { id:"rotina", q:"Como é a sua <em>rotina de trabalho</em>?", sub:"Assim o plano se encaixa no seu dia",
    o:[["🌞","Trabalho de dia"],["🌙","Trabalho à noite"],["🔀","Meus horários são flexíveis"],["📚","Só estudo"],["🏖️","Sou aposentado(a)"],["⏸️","Não estou trabalhando agora"]] },
  { id:"tempo", q:"Quanto tempo por dia você <em>consegue dedicar</em>?",
    o:[["⏱️","Até 15 minutos"],["⏰","De 15 a 30 minutos"],["🕐","De 30 a 60 minutos"],["🗓️","Mais de 1 hora"]] },
  { id:"desafios", q:"Quais desses <em>desafios</em> você vive hoje?", sub:"Marque todos que se aplicam", multi:true,
    o:[["😕","Sinto que ganho pouco"],["⌛","Falta de tempo"],["🔁","Rotina cansativa"],["😟","Preocupação com dinheiro"],["🧭","Não sei por onde começar"],["📉","Medo de ficar para trás"]] },
  { id:"nivel", q:"Qual é a sua <em>experiência com IA</em>?",
    o:[["🌱","Nunca usei"],["💬","Já usei o ChatGPT algumas vezes"],["⚙️","Uso no trabalho, mas quero ir além"]] },
  { id:"criar", q:"O que você gostaria de <em>criar com IA</em>?", sub:"Marque todos que quiser", multi:true,
    o:[["✍️","Textos e posts"],["🖼️","Imagens e artes"],["🎬","Vídeos"],["🤖","Automações"],["💬","Atendimento automático"]] },
  { id:"financas", q:"Como você se sente com a sua <em>vida financeira</em> hoje?",
    o:[["🙂","Tranquilo(a)"],["⚖️","Queria mais estabilidade"],["🧗","Tenho dificuldade de avançar"],["😣","Preciso mudar urgente"]] },
  { id:"renda", q:"Quanto você gostaria de <em>ganhar por mês</em>?",
    o:[["💵","Até R$ 3 mil"],["💰","De R$ 3 mil a R$ 10 mil"],["🏆","Mais de R$ 10 mil"]] },
  { id:"liberdade", q:"Você gostaria de trabalhar com <em>horário flexível</em>, de onde quiser?", two:true,
    o:[["👍","Sim"],["👎","Não"]] },
  { id:"sonho", q:"Existe algo <em>especial</em> que você quer conquistar?", sub:"Ter um objetivo claro aumenta suas chances",
    o:[["🏠","Minha casa"],["✈️","Uma viagem"],["💳","Sair das dívidas"],["👨‍👩‍👧","Dar mais conforto à família"],["🌴","Me aposentar mais cedo"]] },
  { id:"potencial", type:"potential" },
  { id:"carregando", type:"load" },
  { id:"ancora", q:"Quanto você investiria em um <em>plano de IA feito para você</em>?",
    o:[["🟢","R$ 19,90"],["🟡","R$ 29,90"],["🟠","R$ 39,90"]] },
  { id:"raspadinha", type:"scratch" },
  { id:"resultado", type:"result" },
];
const A = {}; let i = 0;
const $ = s => document.querySelector(s);
const app = $("#app");
$("#logo").innerHTML = CONFIG.marca; $("#brand2").textContent = CONFIG.marcaTexto; $("#yr").textContent = new Date().getFullYear();

function render(){
  const s = STEPS[i];
  $("#prog").style.width = Math.round(i / (STEPS.length - 1) * 100) + "%";
  $("#back").style.visibility = i > 0 && s.type !== "result" ? "visible" : "hidden";
  if(s.type === "potential") return renderPotential();
  if(s.type === "scratch") return renderScratch();
  if(s.type === "load") return renderLoad();
  if(s.type === "email") return renderEmail();
  if(s.type === "result") return renderResult();
  const intro = i === 0 ? `<h1>Desafio de IA<br><em>em 28 dias</em></h1>` : "";
  app.innerHTML = `<section class="step on">${intro}<h2>${s.q}</h2>${s.sub ? `<p class="sub">${s.sub}</p>` : ""}
    <div class="opts ${s.two ? "two" : ""}">${s.o.map(([ic, t], k) => `<button class="opt" data-k="${k}"><span class="ic" aria-hidden="true">${ic}</span><span>${t}</span>${s.multi ? `<span class="chk" aria-hidden="true"></span>` : ""}</button>`).join("")}</div>
    ${s.multi ? `<button class="cta" id="next" disabled>Continuar</button>` : ""}
    ${i === 0 ? `<p class="note">Responda algumas perguntas rápidas para montar seu plano.</p>` : ""}</section>`;
  const sel = new Set(A[s.id] || []);
  app.querySelectorAll(".opt").forEach(b => {
    const t = s.o[b.dataset.k][1];
    if(s.multi && sel.has(t)) b.classList.add("sel");
    b.addEventListener("click", () => {
      if(s.multi){ sel.has(t) ? sel.delete(t) : sel.add(t); b.classList.toggle("sel"); $("#next").disabled = !sel.size; A[s.id] = [...sel]; }
      else { A[s.id] = t; b.classList.add("sel"); setTimeout(go, 220); }
    });
  });
  if(s.multi){ $("#next").disabled = !sel.size; $("#next").addEventListener("click", go); }
}
function go(){ i = Math.min(i + 1, STEPS.length - 1); render(); scrollTo(0, 0); }
$("#back").addEventListener("click", () => { if(i > 0){ i--; render(); } });

function renderPotential(){
  const alvo = (A.renda || "uma renda maior").toLowerCase();
  app.innerHTML = `<section class="step on"><p style="text-align:center"><span class="tag">Seu diagnóstico</span></p>
    <h2>Seu <em>potencial com IA</em> é alto</h2>
    <div class="card"><b>Potencial de crescimento</b><div class="meter" style="height:14px"><i id="pm" style="width:0;background:linear-gradient(90deg,#f0a04b,var(--accent));transition:width 1.4s ease"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Baixo</span><span>Médio</span><span>Alto</span></div></div>
    <div class="card"><p style="margin:0">Pelas suas respostas, você tem o perfil para usar IA em <b>${(A.criar || ["textos e posts"]).join(", ").toLowerCase()}</b> e buscar <b>${alvo}</b> com ${(A.tempo || "pouco tempo por dia").toLowerCase()}.</p></div>
    <button class="cta" id="next">Continuar</button></section>`;
  setTimeout(() => { const m = $("#pm"); if(m) m.style.width = "86%"; }, 100);
  $("#next").addEventListener("click", go);
}
function renderScratch(){
  app.innerHTML = `<section class="step on"><h2>Raspe e ganhe um <em>desconto no seu desafio</em></h2>
    <p class="sub">Passe o dedo ou o mouse sobre o cartão</p>
    <div style="position:relative;max-width:320px;margin:0 auto;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--brand-soft);display:grid;place-items:center;text-align:center">
      <div><div style="font:700 15px var(--body);color:var(--muted)">VOCÊ GANHOU</div><div style="font:800 46px/1 var(--display);color:var(--brand)">${CONFIG.desconto}</div><div style="font-size:14px;color:var(--muted)">no seu plano</div></div>
      <canvas id="sc" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab"></canvas></div>
    <button class="cta green" id="next" disabled>Usar meu desconto</button></section>`;
  const c = $("#sc"), x = c.getContext("2d"), r = c.getBoundingClientRect();
  c.width = r.width; c.height = r.height;
  x.fillStyle = "#b9bfd3"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#7d849c"; x.font = "700 18px Inter, sans-serif"; x.textAlign = "center"; x.fillText("RASPE AQUI", c.width / 2, c.height / 2 + 6);
  x.globalCompositeOperation = "destination-out";
  let down = false, n = 0;
  const pos = e => { const b = c.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return [p.clientX - b.left, p.clientY - b.top]; };
  const draw = e => { if(!down) return; e.preventDefault(); const [px, py] = pos(e); x.beginPath(); x.arc(px, py, 22, 0, Math.PI * 2); x.fill(); if(++n > 25){ $("#next").disabled = false; c.style.transition = "opacity .5s"; c.style.opacity = "0"; } };
  ["mousedown", "touchstart"].forEach(ev => c.addEventListener(ev, e => { down = true; draw(e); }, { passive: false }));
  ["mousemove", "touchmove"].forEach(ev => c.addEventListener(ev, draw, { passive: false }));
  ["mouseup", "mouseleave", "touchend"].forEach(ev => c.addEventListener(ev, () => down = false));
  $("#next").addEventListener("click", go);
}
function renderLoad(){
  const rows = ["Analisando suas respostas", "Identificando seu perfil", "Montando seu plano de 28 dias", "Ajustando ao seu tempo disponível"];
  const deps = CONFIG.depoimentos.map(d => `<p class="dep">“${d.texto}”<br><b>${d.nome}</b> · ${d.cargo}</p>`).join("");
  app.innerHTML = `<section class="step on"><h2>Criando seu <em>plano personalizado</em></h2>
    <div class="load">${rows.map((r, k) => `<div class="lrow"><div><span>${r}</span><span id="p${k}">0%</span></div><div class="lbar"><i id="b${k}"></i></div></div>`).join("")}</div>
    ${deps ? `<div class="card">${deps}</div>` : ""}</section>`;
  let k = 0, p = 0, asked = false;
  const t = setInterval(() => {
    p += 4; $("#b" + k).style.width = p + "%"; $("#p" + k).textContent = p + "%";
    if(k === 1 && p >= 60 && !asked){ asked = true; clearInterval(t); ask(() => resume()); return; }
    if(p >= 100){ $("#p" + k).textContent = "100% ✓"; k++; p = 0; if(k >= rows.length){ clearInterval(t); setTimeout(go, 500); } }
  }, 60);
  function resume(){
    const t2 = setInterval(() => {
      p += 4; $("#b" + k).style.width = p + "%"; $("#p" + k).textContent = p + "%";
      if(p >= 100){ $("#p" + k).textContent = "100% ✓"; k++; p = 0; if(k >= rows.length){ clearInterval(t2); setTimeout(go, 500); } }
    }, 60);
  }
}
function ask(done){
  const m = $("#modal"); m.classList.add("on");
  m.querySelectorAll(".opt").forEach(b => b.onclick = () => { A.pronto = b.dataset.m; m.classList.remove("on"); done(); });
}
function renderEmail(){
  app.innerHTML = `<section class="step on"><h2>Seu plano está <em>pronto!</em></h2>
    <p class="sub">Digite seu melhor e-mail para ver o resultado e receber o plano.</p>
    <form id="f"><input class="field" type="email" id="em" required placeholder="seuemail@exemplo.com" autocomplete="email">
    <button class="cta" type="submit">Ver meu plano</button></form>
    <p class="note">Usamos seu e-mail só para enviar o plano. Nada de spam.</p></section>`;
  $("#f").addEventListener("submit", e => { e.preventDefault(); A.email = $("#em").value.trim(); /* Conecte aqui sua ferramenta de e-mail (webhook, RD Station, etc.) */ go(); });
}
function renderResult(){
  const tempo = A.tempo || "15 minutos por dia", meta = (A.meta || "seu objetivo").toLowerCase();
  const criar = (A.criar || ["textos e posts"]).map(x => x.toLowerCase()).join(", ");
  const inicio = { "Nunca usei": 10, "Já usei o ChatGPT algumas vezes": 30, "Uso no trabalho, mas quero ir além": 50 }[A.nivel] || 20;
  app.innerHTML = `<section class="step on">
    <p style="text-align:center"><span class="tag">Plano personalizado</span></p>
    <h2>Seu plano para <em>${meta}</em> com IA</h2>
    <p class="sub">Montado para ${tempo.toLowerCase()}, com foco em ${criar}.</p>
    <div class="compare">
      <div class="card"><b>Hoje</b>Domínio de IA<div class="meter"><i style="width:${inicio}%;background:#f0a04b"></i></div><small>${A.nivel || "Iniciante"}</small></div>
      <div class="card"><b>Em 28 dias</b>Domínio de IA<div class="meter"><i style="width:85%;background:var(--accent)"></i></div><small>Usando IA no dia a dia</small></div>
    </div>
    <div class="card"><h2 style="text-align:left;margin-top:0">Sua rota de 4 semanas</h2>
      <ul class="weeks">
        <li><span class="n">S1</span><div><b>Fundamentos</b><p>As ferramentas certas e como escrever bons comandos.</p></div></li>
        <li><span class="n">S2</span><div><b>Criação</b><p>Produza ${criar} em minutos.</p></div></li>
        <li><span class="n">S3</span><div><b>Produtividade</b><p>Automatize tarefas repetitivas e ganhe tempo.</p></div></li>
        <li><span class="n">S4</span><div><b>Aplicação</b><p>Use o que aprendeu para ${meta}.</p></div></li>
      </ul></div>
    <div class="card"><h2 style="text-align:left;margin-top:0">O que você recebe</h2>
      <ul class="inc"><li>28 aulas curtas, uma por dia</li><li>Biblioteca de comandos prontos para copiar</li><li>Exercícios práticos com cada ferramenta</li><li>Acesso pelo celular ou computador</li><li>Certificado de conclusão</li></ul></div>
    <div class="card price"><span class="tag">${CONFIG.desconto} aplicado</span>
      ${CONFIG.cronometroMin ? `<p class="note">Desconto válido por <b id="tm"></b></p>` : ""}
      ${CONFIG.teste
        ? `<p style="margin:12px 0 0">Teste por ${CONFIG.teste.periodo}</p><div class="big">${CONFIG.teste.preco}</div>
           <p class="note" style="margin:0">Depois, ${CONFIG.teste.renovacao}. Cancele quando quiser.</p>`
        : `<p style="margin:12px 0 0">De <s>${CONFIG.precoDe}</s> por</p><div class="big">${CONFIG.precoPor}</div>
           <p class="note" style="margin:0">${CONFIG.parcelas} · pagamento único</p>`}
      <a class="cta green" href="${CONFIG.checkout}" target="_blank" rel="noopener">Quero começar meu desafio</a>
      <p class="note">🔒 Compra segura · Garantia incondicional de ${CONFIG.garantia}</p></div>
    <div class="card faq"><h2 style="text-align:left;margin-top:0">Perguntas frequentes</h2>
      <details><summary>Preciso saber tecnologia?</summary><p>Não. O desafio começa do zero e explica cada passo.</p></details>
      <details><summary>Quanto tempo por dia?</summary><p>As aulas foram pensadas para caber em ${tempo.toLowerCase()}.</p></details>
      <details><summary>Como recebo o acesso?</summary><p>Logo após a compra, você recebe o acesso no e-mail.</p></details>
      <details><summary>E se eu não gostar?</summary><p>Você tem ${CONFIG.garantia} de garantia. Pediu, recebeu seu dinheiro de volta.</p></details>
    </div></section>`;
  if(CONFIG.cronometroMin){
    let s = CONFIG.cronometroMin * 60;
    const tick = () => { const el = $("#tm"); if(!el) return; el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); if(s > 0){ s--; setTimeout(tick, 1000); } };
    tick();
  }
}
render();
</script>
</body>
</html>
