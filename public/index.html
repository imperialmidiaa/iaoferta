<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080f">
<title>Desafio IA em 28 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
<style>
/* ===== Versão A: escura e tecnológica ===== */
:root{
  --display:"Space Grotesk","Segoe UI",sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
  --h1w:700; --h2w:700; --radius:14px;
  --bg:#07080f; --top-bg:rgba(7,8,15,.75);
  --card:rgba(255,255,255,.035); --card-solid:#11131f; --card-hi:rgba(124,108,255,.13);
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.25);
  --ink:#eef0ff; --muted:#9298b8;
  --brand:#7c6cff; --brand-ink:#fff; --logo-accent:#22d3ee;
  --em:#b3a9ff;
  --bar:linear-gradient(90deg,#7c6cff,#22d3ee); --meter-low:#f59e6b;
  --tile:linear-gradient(145deg,rgba(124,108,255,.22),rgba(34,211,238,.08)); --tile-ink:#cfc8ff;
  --cta-bg:linear-gradient(135deg,#7c6cff 0%,#5b7cff 100%); --cta-ink:#fff;
  --cta-shadow:0 12px 32px -12px rgba(124,108,255,.8),inset 0 1px 0 rgba(255,255,255,.2);
  --buy-bg:linear-gradient(135deg,#22d3ee 0%,#7c6cff 100%); --buy-ink:#fff;
  --buy-shadow:0 14px 36px -12px rgba(34,211,238,.6),inset 0 1px 0 rgba(255,255,255,.25);
  --badge-bg:rgba(124,108,255,.12); --badge-ink:#cfc8ff; --badge-line:rgba(124,108,255,.35);
  --ok:#34d399; --shadow:none; --sel-shadow:0 0 0 4px rgba(124,108,255,.15);
  --glow:0 0 50px -10px rgba(124,108,255,.6);
  --overlay:rgba(3,4,10,.72);
  --prize-bg:radial-gradient(circle at 50% 35%,rgba(124,108,255,.35),transparent 70%),#0d0f1a;
  --scratch:#262a40; --scratch-ink:#8d93b5;
  --price-bg:linear-gradient(180deg,rgba(124,108,255,.12),rgba(255,255,255,.02)); --price-line:rgba(124,108,255,.45);
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(620px 420px at 88% -8%,rgba(124,108,255,.28),transparent 62%),
    radial-gradient(520px 420px at -12% 38%,rgba(34,211,238,.10),transparent 60%),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 55%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.35) 55%,transparent 100%)}
h1 em,h2 em,.scratch .pct{background:linear-gradient(90deg,#b3a9ff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Opções de resposta com mais contraste */
.opt{backdrop-filter:blur(6px);color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));
  border-color:rgba(255,255,255,.17);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 24px -16px rgba(0,0,0,.9)}
.opt:hover{border-color:rgba(139,125,255,.85);background:linear-gradient(180deg,rgba(124,108,255,.18),rgba(124,108,255,.07));box-shadow:0 0 0 3px rgba(124,108,255,.16)}
.opt .ic{background:linear-gradient(145deg,rgba(124,108,255,.5),rgba(34,211,238,.24));color:#fff;border:1px solid rgba(255,255,255,.14)}
.opt .arr{color:#c9c2ff;opacity:.85}
.opt .chk{border-color:rgba(255,255,255,.45)}
.opt.sel{border-color:#8b7dff;background:linear-gradient(180deg,rgba(124,108,255,.32),rgba(124,108,255,.14));box-shadow:0 0 0 4px rgba(124,108,255,.22),0 12px 30px -12px rgba(124,108,255,.75)}
.opt.sel .ic{background:linear-gradient(135deg,#7c6cff,#22d3ee);border-color:transparent}
.price .big{background:linear-gradient(180deg,#fff,#c9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <button class="back" id="back" aria-label="Voltar"></button>
    <div class="logo" id="logo"></div>
    <span class="count" id="count"></span>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="app"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mq">
  <div class="box"><h2 id="mq">Você está pronto para começar hoje?</h2>
    <div class="opts"><button class="opt" data-m="nao">Ainda não</button><button class="opt" data-m="sim">Sim!</button></div></div>
</div>
<footer>© <span id="yr"></span> <span id="brand2"></span> · Termos de uso · Política de privacidade</footer>
<script src="quiz.js"></script>
</body>
</html>
