<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reto de IA en 28 Días</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Colores de tu marca ===== */
:root{
  --brand:#1f5fe0; --brand-ink:#fff; --brand-soft:#e8f0ff; --accent:#f28c28;
  --bg:#f7f7fb; --card:#fff; --ink:#15132b; --muted:#6a6884; --line:#e4e2f0;
  --display:"Sora","Trebuchet MS",sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 8px}
.topin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:40px 1fr 40px;align-items:center}
.back{border:0;background:none;font-size:22px;color:var(--ink);visibility:hidden}
.logo{text-align:center;font:800 18px var(--display);letter-spacing:-.02em}
.logo span{color:var(--brand)}
.bar{max-width:520px;margin:10px auto 0;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .35s}
main{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.step{display:none;animation:in .3s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:800 clamp(28px,7vw,38px)/1.1 var(--display);letter-spacing:-.02em;margin:18px 0 10px;text-align:center;text-wrap:balance}
h2{font:700 clamp(22px,5.5vw,28px)/1.2 var(--display);margin:14px 0 8px;text-align:center;text-wrap:balance}
h2 em,h1 em{font-style:normal;color:var(--brand)}
.sub{color:var(--muted);text-align:center;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font-weight:600;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--brand)}
.opt:active{transform:scale(.99)}
.opt .ic{font-size:24px;line-height:1}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opts.two .opt{flex-direction:column;justify-content:center;text-align:center;padding:20px 10px}
.opts.two .opt .ic{font-size:40px}
.opt .chk{margin-left:auto;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none}
.opt.sel .chk{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px var(--brand-soft)}
.cta{display:block;width:100%;border:0;border-radius:14px;padding:16px;background:var(--brand);color:var(--brand-ink);font:700 17px var(--body);margin-top:18px;text-align:center;text-decoration:none}
.cta:disabled{opacity:.45;cursor:not-allowed}
.cta.green{background:var(--accent);color:#2b1600}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.hero-ic{font-size:64px;text-align:center;margin:18px 0 0}
.load{display:grid;gap:14px;margin:20px 0}
.lrow{font-weight:600;font-size:15px}
.lrow div{display:flex;justify-content:space-between}
.lbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.lbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s linear}
.modal{position:fixed;inset:0;background:rgba(21,19,43,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;max-width:380px;width:100%;text-align:center}
.box .opts{grid-template-columns:1fr 1fr;margin-top:14px}
.box .opt{justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.compare .card{margin:0;text-align:center}
.compare b{display:block;font:700 15px var(--display);margin-bottom:8px}
.meter{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
.weeks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.weeks li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.weeks .n{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 15px var(--display)}
.weeks p{margin:2px 0 0;color:var(--muted);font-size:14px}
.inc{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.inc li::before{content:"✓";color:var(--accent);font-weight:800;margin-right:8px}
.facts{display:grid;gap:10px;margin-top:14px}
.fact{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.fact .fi{font-size:26px;line-height:1}
.fact b{display:block;margin-bottom:2px}
.fact p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chips span{background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px}
.price{text-align:center}
.price s{color:var(--muted)}
.price .big{font:800 44px/1 var(--display);margin:6px 0;color:var(--ink)}
.faq details{border-top:1px solid var(--line);padding:12px 0}
.faq summary{font-weight:700;cursor:pointer}
.faq p{color:var(--muted);margin:8px 0 0}
.dep{font-size:14px;color:var(--muted);border-left:3px solid var(--brand);padding-left:10px;margin:10px 0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:20px 16px}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <button class="back" id="back" aria-label="Volver">←</button>
    <div class="logo" id="logo"></div>
    <span></span>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
</header>
<main id="app"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mq">
  <div class="box"><h2 id="mq" style="margin-top:0">¿Estás listo para empezar hoy?</h2>
    <div class="opts"><button class="opt" data-m="no">Todavía no</button><button class="opt" data-m="si">¡Sí!</button></div></div>
</div>
<footer>© <span id="yr"></span> <span id="brand2"></span> · Términos de uso · Política de privacidad</footer>

<script>
/* ============ CONFIGURA AQUÍ ============ */
const CONFIG = {
  marca: "Ruta<span>IA</span>",           // nombre de tu marca (puedes usar <span> para colorear una parte)
  marcaTexto: "RutaIA",                   // nombre sin formato, para el pie de página
  checkout: "https://TU-CHECKOUT-AQUI",   // enlace de tu checkout (Hotmart, Kiwify, Cakto…)
  precoDe: "US$ 47",
  precoPor: "US$ 9,90",
  parcelas: "",                           // ej.: "o 3 cuotas de US$ 3,30" (déjalo vacío si no aplica)
  garantia: "7 días",
  desconto: "70% OFF",                    // lo que aparece en la tarjeta para raspar (usa un descuento real)
  // Suscripción con periodo de prueba (deja teste: null para pago único)
  teste: null,                            // ej.: { preco: "US$ 4,90", periodo: "7 días", renovacao: "US$ 19,90 cada 4 semanas" }
  cronometroMin: 0,                       // minutos del cronómetro de la oferta; 0 lo apaga. Úsalo solo con un plazo real.
  // Testimonios: usa solo testimonios reales de alumnos, con autorización.
  depoimentos: [
    // { nome: "Nombre del alumno", cargo: "Profesión", texto: "Lo que dijo de verdad." },
  ],
};
/* ======================================== */

const STEPS = [
  { id:"genero", q:"Responde rápido y recibe <em>tu plan</em>", sub:"Para empezar, ¿cómo te identificas?", two:true,
    o:[["👨","Hombre"],["👩","Mujer"]] },
  { id:"idade", q:"Tu plan de IA empieza <em>donde estás hoy</em>", sub:"¿Cuál es tu rango de edad?", two:true,
    o:[["🧑","18 a 24"],["👩","25 a 34"],["🧔","35 a 44"],["👵","45 o más"]] },
  { id:"meta", q:"¿Qué quieres conseguir con IA <em>en los próximos 28 días</em>?",
    o:[["💰","Ganar más sin trabajar más horas"],["📈","Conseguir mejores oportunidades de trabajo"],["🎯","Aprender una habilidad bien pagada"],["🕊️","Tener más tiempo libre y menos estrés"],["🚀","Crear mi propio negocio"]] },
  { id:"area", q:"¿Cuál de estas opciones describe <em>tu momento</em>?", sub:"Elige la más cercana",
    o:[["🏢","Empleo fijo"],["💻","Independiente o freelancer"],["🏪","Tengo un negocio"],["🎓","Estudiante"],["🔎","Buscando oportunidades"]] },
  { id:"rotina", q:"¿Cómo es tu <em>rutina de trabajo</em>?", sub:"Así el plan se adapta a tu día",
    o:[["🌞","Trabajo de día"],["🌙","Trabajo de noche"],["🔀","Mis horarios son flexibles"],["📚","Solo estudio"],["🏖️","Estoy jubilado(a)"],["⏸️","No estoy trabajando ahora"]] },
  { id:"desafios", q:"¿Cuáles de estos <em>desafíos</em> vives hoy?", sub:"Marca todos los que apliquen", multi:true,
    o:[["😕","Siento que gano poco"],["⌛","Me falta tiempo"],["🔁","Rutina agotadora"],["😟","Preocupación por el dinero"],["🧭","No sé por dónde empezar"],["📉","Miedo a quedarme atrás"]] },
  { id:"i_gracias", type:"info", ic:"🙌", t:"¡Gracias! Ya estamos <em>armando tu plan</em>",
    p:"Cada respuesta ajusta tu ruta de 28 días. Faltan pocas preguntas para tenerla lista." },
  { id:"financas", q:"¿Cómo te sientes con tu <em>situación financiera</em> hoy?",
    o:[["🙂","Tranquilo(a)"],["⚖️","Quisiera más estabilidad"],["🧗","Me cuesta avanzar"],["😣","Necesito un cambio urgente"]] },
  { id:"renda", q:"¿Cuánto te gustaría <em>ganar al mes</em>?",
    o:[["💵","Hasta US$ 1.000"],["💰","De US$ 1.000 a US$ 3.000"],["🏆","Más de US$ 3.000"]] },
  { id:"liberdade", q:"¿Te gustaría trabajar con <em>horario flexible</em>, desde donde quieras?", two:true,
    o:[["👍","Sí"],["👎","No"]] },
  { id:"automatizar", q:"¿Te gustaría que la IA hiciera <em>tus tareas repetitivas</em>?", two:true,
    o:[["🤖","¡Sí, claro!"],["🙅","Por ahora no"]] },
  { id:"estilo", q:"¿Quieres un trabajo que vaya <em>con tu estilo de vida</em>?", two:true,
    o:[["💯","Totalmente"],["🤷","No necesariamente"]] },
  { id:"i_datos", type:"facts", t:"La IA ya está <em>cambiando el trabajo</em>",
    f:[["⚡","Tareas en minutos","Textos, imágenes y resúmenes que antes tomaban horas hoy se hacen en pocos minutos."],
       ["🧑‍💼","Nuevas oportunidades","Negocios de todos los tamaños buscan personas que sepan usar herramientas de IA."],
       ["📱","Desde el celular","Muchas herramientas funcionan en el teléfono, sin computadora potente ni conocimientos técnicos."]] },
  { id:"nivel", q:"¿Cuánto sabes sobre <em>inteligencia artificial</em>?",
    o:[["🌱","Nada, empiezo de cero"],["💬","Probé ChatGPT algunas veces"],["🧰","Conozco algunas herramientas"],["⚙️","La uso en el trabajo y quiero ir más allá"]] },
  { id:"extra", q:"¿Ya intentaste tener <em>ingresos extra</em>?",
    o:[["🔁","Sí, hago trabajos de vez en cuando"],["🏢","No, solo tengo mi trabajo principal"],["💻","Ya hice trabajos freelance"],["🆕","Nunca lo intenté"]] },
  { id:"aprender", q:"¿Te resulta fácil <em>aprender cosas nuevas</em>?",
    o:[["⚡","Sí, me adapto rápido"],["🐢","Me cuesta un poco, pero lo logro"],["😅","Me cuesta bastante"]] },
  { id:"ferramentas", q:"¿Qué <em>herramientas de IA</em> ya conoces?", sub:"Marca todas las que quieras. Si no conoces ninguna, no pasa nada.", multi:true,
    o:[["💬","ChatGPT"],["✨","Gemini"],["🎨","Generadores de imágenes"],["🎬","Editores de video con IA"],["🙈","Ninguna todavía"]] },
  { id:"criar", q:"¿Qué te gustaría <em>crear con IA</em>?", sub:"Marca todo lo que quieras", multi:true,
    o:[["✍️","Textos y publicaciones"],["🖼️","Imágenes y diseños"],["🎬","Videos"],["🤖","Automatizaciones"],["💬","Atención automática a clientes"]] },
  { id:"i_resumo", type:"summary" },
  { id:"potencial", type:"potential" },
  { id:"sonho", q:"¿Hay algo <em>especial</em> que quieras lograr?", sub:"Tener una meta clara aumenta tus posibilidades",
    o:[["🏠","Mi casa propia"],["✈️","Un viaje"],["💳","Salir de deudas"],["👨‍👩‍👧","Darle más comodidad a mi familia"],["🌴","Jubilarme antes"]] },
  { id:"tempo", q:"¿Cuánto tiempo al día <em>puedes dedicar</em>?",
    o:[["⏱️","Hasta 15 minutos"],["⏰","De 15 a 30 minutos"],["🕐","De 30 a 60 minutos"],["🗓️","Más de 1 hora"]] },
  { id:"i_prova", type:"info", ic:"🚀", t:"Personas con tu perfil <em>ya empezaron</em>",
    p:"Con pocos minutos al día y paso a paso, la IA se vuelve una herramienta de trabajo en pocas semanas.", btn:"Quiero avanzar" },
  { id:"carregando", type:"load" },
  { id:"ancora", q:"¿Cuánto invertirías en un <em>plan de IA hecho para ti</em>?",
    o:[["🟢","US$ 9"],["🟡","US$ 19"],["🟠","US$ 29"]] },
  { id:"raspadinha", type:"scratch" },
  { id:"resultado", type:"result" },
];
const A = {}; let i = 0;
const $ = s => document.querySelector(s);
const app = $("#app");
$("#logo").innerHTML = CONFIG.marca; $("#brand2").textContent = CONFIG.marcaTexto; $("#yr").textContent = new Date().getFullYear();
const low = x => String(x || "").toLowerCase();

function render(){
  const s = STEPS[i];
  $("#prog").style.width = Math.round(i / (STEPS.length - 1) * 100) + "%";
  $("#back").style.visibility = i > 0 && s.type !== "result" ? "visible" : "hidden";
  if(s.type === "info") return renderInfo(s);
  if(s.type === "facts") return renderFacts(s);
  if(s.type === "summary") return renderSummary();
  if(s.type === "potential") return renderPotential();
  if(s.type === "scratch") return renderScratch();
  if(s.type === "load") return renderLoad();
  if(s.type === "result") return renderResult();
  const intro = i === 0 ? `<h1>¡Reto de IA<br><em>en 28 días</em>!</h1>` : "";
  app.innerHTML = `<section class="step on">${intro}<h2>${s.q}</h2>${s.sub ? `<p class="sub">${s.sub}</p>` : ""}
    <div class="opts ${s.two ? "two" : ""}">${s.o.map(([ic, t], k) => `<button class="opt" data-k="${k}"><span class="ic" aria-hidden="true">${ic}</span><span>${t}</span>${s.multi ? `<span class="chk" aria-hidden="true"></span>` : ""}</button>`).join("")}</div>
    ${s.multi ? `<button class="cta" id="next" disabled>Continuar</button>` : ""}
    ${i === 0 ? `<p class="note">Responde unas preguntas rápidas para armar tu plan.</p>` : ""}</section>`;
  const sel = new Set(A[s.id] || []);
  app.querySelectorAll(".opt").forEach(b => {
    const t = s.o[b.dataset.k][1];
    if(s.multi && sel.has(t)) b.classList.add("sel");
    b.addEventListener("click", () => {
      if(s.multi){ sel.has(t) ? sel.delete(t) : sel.add(t); b.classList.toggle("sel"); $("#next").disabled = !sel.size; A[s.id] = [...sel]; }
      else { A[s.id] = t; b.classList.add("sel"); setTimeout(go, 220); }
    });
  });
  if(s.multi){ $("#next").disabled = !sel.size; $("#next").addEventListener("click", go); }
}
function go(){ i = Math.min(i + 1, STEPS.length - 1); render(); scrollTo(0, 0); }
$("#back").addEventListener("click", () => { if(i > 0){ i--; render(); } });
function nextBtn(label){ return `<button class="cta" id="next">${label || "Continuar"}</button>`; }
function bindNext(){ $("#next").addEventListener("click", go); }

function renderInfo(s){
  app.innerHTML = `<section class="step on"><div class="hero-ic" aria-hidden="true">${s.ic}</div><h2>${s.t}</h2><p class="sub">${s.p}</p>${nextBtn(s.btn)}</section>`;
  bindNext();
}
function renderFacts(s){
  app.innerHTML = `<section class="step on"><h2>${s.t}</h2><div class="facts">${s.f.map(([ic, b, p]) => `<div class="fact"><span class="fi" aria-hidden="true">${ic}</span><div><b>${b}</b><p>${p}</p></div></div>`).join("")}</div>${nextBtn()}</section>`;
  bindNext();
}
function renderSummary(){
  const areas = A.criar || ["Textos y publicaciones"];
  app.innerHTML = `<section class="step on"><div class="hero-ic" aria-hidden="true">🧠</div><h2>Estamos preparando tu <em>plan de aprendizaje</em></h2>
    <p class="sub">Según tus respuestas, quieres usar la IA para:</p>
    <div class="chips">${areas.map(a => `<span>${a}</span>`).join("")}</div>
    <div class="card"><p style="margin:0">Objetivo: <b>${low(A.meta) || "crecer con IA"}</b><br>Nivel actual: <b>${low(A.nivel) || "principiante"}</b></p></div>
    ${nextBtn()}</section>`;
  bindNext();
}
function renderPotential(){
  app.innerHTML = `<section class="step on"><p style="text-align:center"><span class="tag">Tu diagnóstico</span></p>
    <h2>Tu <em>potencial con IA</em> es alto</h2>
    <div class="card"><b>Potencial de crecimiento</b><div class="meter" style="height:14px"><i id="pm" style="width:0;background:linear-gradient(90deg,#f0a04b,var(--brand));transition:width 1.4s ease"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Bajo</span><span>Medio</span><span>Alto</span></div></div>
    <div class="card"><p style="margin:0">Por tus respuestas, tienes el perfil para usar IA en <b>${low((A.criar || ["textos y publicaciones"]).join(", "))}</b> y buscar <b>${low(A.renda) || "más ingresos"}</b>.</p></div>
    ${nextBtn()}</section>`;
  setTimeout(() => { const m = $("#pm"); if(m) m.style.width = "86%"; }, 100);
  bindNext();
}
function renderScratch(){
  app.innerHTML = `<section class="step on"><h2>Raspa y gana un <em>descuento en tu reto</em></h2>
    <p class="sub">Pasa el dedo o el mouse sobre la tarjeta</p>
    <div style="position:relative;max-width:320px;margin:0 auto;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:var(--brand-soft);display:grid;place-items:center;text-align:center">
      <div><div style="font:700 15px var(--body);color:var(--muted)">¡GANASTE!</div><div style="font:800 46px/1 var(--display);color:var(--brand)">${CONFIG.desconto}</div><div style="font-size:14px;color:var(--muted)">en tu plan</div></div>
      <canvas id="sc" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab"></canvas></div>
    <button class="cta green" id="next" disabled>Usar mi descuento</button></section>`;
  const c = $("#sc"), x = c.getContext("2d"), r = c.getBoundingClientRect();
  c.width = r.width; c.height = r.height;
  x.fillStyle = "#b9bfd3"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#7d849c"; x.font = "700 18px Inter, sans-serif"; x.textAlign = "center"; x.fillText("RASPA AQUÍ", c.width / 2, c.height / 2 + 6);
  x.globalCompositeOperation = "destination-out";
  let down = false, n = 0;
  const pos = e => { const b = c.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; return [p.clientX - b.left, p.clientY - b.top]; };
  const draw = e => { if(!down) return; e.preventDefault(); const [px, py] = pos(e); x.beginPath(); x.arc(px, py, 22, 0, Math.PI * 2); x.fill(); if(++n > 25){ $("#next").disabled = false; c.style.transition = "opacity .5s"; c.style.opacity = "0"; } };
  ["mousedown", "touchstart"].forEach(ev => c.addEventListener(ev, e => { down = true; draw(e); }, { passive: false }));
  ["mousemove", "touchmove"].forEach(ev => c.addEventListener(ev, draw, { passive: false }));
  ["mouseup", "mouseleave", "touchend"].forEach(ev => c.addEventListener(ev, () => down = false));
  bindNext();
}
function renderLoad(){
  const rows = ["Analizando tus respuestas", "Identificando tu perfil", "Armando tu plan de 28 días", "Ajustando a tu tiempo disponible"];
  const deps = CONFIG.depoimentos.map(d => `<p class="dep">“${d.texto}”<br><b>${d.nome}</b> · ${d.cargo}</p>`).join("");
  app.innerHTML = `<section class="step on"><h2>Creando tu <em>plan personalizado</em></h2>
    <div class="load">${rows.map((r, k) => `<div class="lrow"><div><span>${r}</span><span id="p${k}">0%</span></div><div class="lbar"><i id="b${k}"></i></div></div>`).join("")}</div>
    ${deps ? `<div class="card">${deps}</div>` : ""}</section>`;
  let k = 0, p = 0, asked = false;
  const run = () => {
    const t = setInterval(() => {
      p += 4; $("#b" + k).style.width = p + "%"; $("#p" + k).textContent = p + "%";
      if(k === 1 && p >= 60 && !asked){ asked = true; clearInterval(t); ask(run); return; }
      if(p >= 100){ $("#p" + k).textContent = "100% ✓"; k++; p = 0; if(k >= rows.length){ clearInterval(t); setTimeout(go, 500); } }
    }, 60);
  };
  run();
}
function ask(done){
  const m = $("#modal"); m.classList.add("on");
  m.querySelectorAll(".opt").forEach(b => b.onclick = () => { A.listo = b.dataset.m; m.classList.remove("on"); done(); });
}
function renderResult(){
  const tempo = low(A.tempo) || "pocos minutos al día", meta = low(A.meta) || "tu objetivo";
  const criar = low((A.criar || ["textos y publicaciones"]).join(", "));
  const inicio = { "Nada, empiezo de cero": 10, "Probé ChatGPT algunas veces": 25, "Conozco algunas herramientas": 40, "La uso en el trabajo y quiero ir más allá": 55 }[A.nivel] || 20;
  app.innerHTML = `<section class="step on">
    <p style="text-align:center"><span class="tag">Plan personalizado</span></p>
    <h2>Tu plan para <em>${meta}</em> con IA</h2>
    <p class="sub">Pensado para ${tempo}, con foco en ${criar}.</p>
    <div class="compare">
      <div class="card"><b>Hoy</b>Dominio de IA<div class="meter"><i style="width:${inicio}%;background:#f0a04b"></i></div><small>${A.nivel || "Principiante"}</small></div>
      <div class="card"><b>En 28 días</b>Dominio de IA<div class="meter"><i style="width:85%;background:var(--brand)"></i></div><small>Usando IA en tu día a día</small></div>
    </div>
    <div class="card"><h2 style="text-align:left;margin-top:0">Tu ruta de 4 semanas</h2>
      <ul class="weeks">
        <li><span class="n">S1</span><div><b>Fundamentos</b><p>Las herramientas correctas y cómo escribir buenas instrucciones.</p></div></li>
        <li><span class="n">S2</span><div><b>Creación</b><p>Produce ${criar} en minutos.</p></div></li>
        <li><span class="n">S3</span><div><b>Productividad</b><p>Automatiza tareas repetitivas y gana tiempo.</p></div></li>
        <li><span class="n">S4</span><div><b>Aplicación</b><p>Usa lo aprendido para ${meta}.</p></div></li>
      </ul></div>
    <div class="card"><h2 style="text-align:left;margin-top:0">Lo que recibes</h2>
      <ul class="inc"><li>28 lecciones cortas, una por día</li><li>Biblioteca de instrucciones listas para copiar</li><li>Ejercicios prácticos con cada herramienta</li><li>Acceso desde el celular o la computadora</li><li>Certificado de finalización</li></ul></div>
    <div class="card price"><span class="tag">${CONFIG.desconto} aplicado</span>
      ${CONFIG.cronometroMin ? `<p class="note">Descuento válido por <b id="tm"></b></p>` : ""}
      ${CONFIG.teste
        ? `<p style="margin:12px 0 0">Prueba por ${CONFIG.teste.periodo}</p><div class="big">${CONFIG.teste.preco}</div>
           <p class="note" style="margin:0">Después, ${CONFIG.teste.renovacao}. Cancela cuando quieras.</p>`
        : `<p style="margin:12px 0 0">De <s>${CONFIG.precoDe}</s> a</p><div class="big">${CONFIG.precoPor}</div>
           <p class="note" style="margin:0">${CONFIG.parcelas ? CONFIG.parcelas + " · " : ""}pago único</p>`}
      <a class="cta green" href="${CONFIG.checkout}" target="_blank" rel="noopener">Quiero empezar mi reto</a>
      <p class="note">🔒 Compra segura · Garantía incondicional de ${CONFIG.garantia}</p></div>
    <div class="card faq"><h2 style="text-align:left;margin-top:0">Preguntas frecuentes</h2>
      <details><summary>¿Necesito saber de tecnología?</summary><p>No. El reto empieza desde cero y explica cada paso.</p></details>
      <details><summary>¿Cuánto tiempo al día?</summary><p>Las lecciones están pensadas para ${tempo}.</p></details>
      <details><summary>¿Cómo recibo el acceso?</summary><p>Justo después de la compra recibes el acceso en tu correo.</p></details>
      <details><summary>¿Y si no me gusta?</summary><p>Tienes ${CONFIG.garantia} de garantía. Lo pides y te devolvemos tu dinero.</p></details>
    </div></section>`;
  if(CONFIG.cronometroMin){
    let s = CONFIG.cronometroMin * 60;
    const tick = () => { const el = $("#tm"); if(!el) return; el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); if(s > 0){ s--; setTimeout(tick, 1000); } };
    tick();
  }
}
render();
</script>
</body>
